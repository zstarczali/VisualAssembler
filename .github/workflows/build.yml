name: Build Tauri (Windows + macOS + Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm test

      - name: Run Rust integration tests
        working-directory: src-tauri
        run: cargo test --test exomizer_integration

  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    # the installers only on a manual run (Actions → Build Tauri → Run workflow); a push / PR runs the tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: Windows
            runner: windows-latest
            arch: arm64
            target: aarch64-pc-windows-msvc
          - os: macOS
            runner: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - os: macOS
            runner: macos-26
            arch: x64
            target: x86_64-apple-darwin
          - os: Linux
            runner: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-pulseaudio libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      # WebKitGTK plays Web Audio through GStreamer: without these the player runs in silence.
      - name: Verify the sound plugins of the Linux packages
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          BUNDLE="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle"
          dpkg-deb -f "$BUNDLE"/deb/*.deb Depends | grep -q gstreamer1.0-plugins-good
          cd "$(mktemp -d)"
          "$BUNDLE"/appimage/*.AppImage --appimage-extract > /dev/null
          for plugin in libgstapp.so libgstautodetect.so; do
            find squashfs-root -name "$plugin" | grep -q . || { echo "missing: $plugin"; exit 1; }
          done

      - name: Verify macOS app icon
        if: matrix.os == 'macOS'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/C64 Visual Assembler.app"
          test -s "$APP/Contents/Resources/Assets.car"
          cmp src-tauri/icons/generated/Assets.car "$APP/Contents/Resources/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist")" = AppIcon
          test -s "$APP/Contents/Resources/icon.icns"
          codesign --verify --deep --strict "$APP"

      - name: Upload artifacts (Windows)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
