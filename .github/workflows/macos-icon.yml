name: macOS 26 app icon (Assets.car)

# Ugyanazt a fordítót futtatja, mint a macOS Tauri build.
# Az artefakt külön letölthető ellenőrzéshez; a release build maga állítja elő az ikont.

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/icons/AppIcon.icon/**"
      - ".github/workflows/macos-icon.yml"
      - "scripts/build-macos-icon.cjs"

permissions:
  contents: read

jobs:
  icon:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --find actool

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Assets.car
        run: |
          node scripts/build-macos-icon.cjs
          mkdir -p out
          cp src-tauri/icons/generated/* out/

      - name: Inspect Assets.car
        run: xcrun --sdk macosx assetutil --info out/Assets.car | tee out/assetutil.json

      - name: Render previews
        continue-on-error: true
        run: |
          ICTOOL=$(find "$(xcode-select -p)/.." -name ictool -type f 2>/dev/null | head -1)
          echo "ictool: $ICTOOL"
          for a in Light Dark TintedLight ClearLight; do
            "$ICTOOL" "$PWD/src-tauri/icons/AppIcon.icon" --export-preview macOS "$a" 512 512 1 "$PWD/out/preview-$a.png" || true
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-icon
          path: out/
          if-no-files-found: error
