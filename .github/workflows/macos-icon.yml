name: macOS 26 app icon (Assets.car)

# Az Icon Composer .icon csomagból (src-tauri/icons/AppIcon.icon) Assets.car-t fordít az Apple actool-jával,
# hogy macOS 26 (Tahoe) alatt ne kerüljön szürke squircle-lapra az ikon. Az eredmény artefakt:
# Assets.car + AppIcon.icns (fallback) + assetutil-lista + PNG előnézetek; ezt kell a repóba tenni
# (src-tauri/icons/Assets.car), a Tauri bundle innen másolja a Contents/Resources-ba.

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/icons/AppIcon.icon/**"
      - ".github/workflows/macos-icon.yml"

permissions:
  contents: read

jobs:
  icon:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --find actool

      - name: Compile Assets.car
        run: |
          mkdir -p out
          xcrun actool "$PWD/src-tauri/icons/AppIcon.icon" \
            --compile "$PWD/out" \
            --app-icon AppIcon \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --platform macosx \
            --include-all-app-icons \
            --minimum-deployment-target 11.0 \
            --output-partial-info-plist "$PWD/out/partial.plist" \
            --output-format human-readable-text --notices --warnings --errors
          ls -la out

      - name: Inspect Assets.car
        run: xcrun --sdk macosx assetutil --info out/Assets.car | tee out/assetutil.json

      - name: Render previews
        continue-on-error: true
        run: |
          ICTOOL=$(find "$(xcode-select -p)/.." -name ictool -type f 2>/dev/null | head -1)
          echo "ictool: $ICTOOL"
          for a in Light Dark TintedLight ClearLight; do
            "$ICTOOL" "$PWD/src-tauri/icons/AppIcon.icon" --export-preview macOS "$a" 512 512 1 "$PWD/out/preview-$a.png" || true
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-icon
          path: out/
          if-no-files-found: error
