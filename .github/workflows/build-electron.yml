name: Build Electron (Windows + macOS x64/arm64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Windows build (NSIS) a package.json script alapján
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist

      # macOS build - explicit arch
      - name: Build (macOS x64)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: npx electron-builder --mac --x64

      - name: Build (macOS arm64)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: npx electron-builder --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ matrix.arch }}-dist
          path: dist/**
          if-no-files-found: error