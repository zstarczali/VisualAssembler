<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Assembler Documentation</title>
<style>
:root{--yellow:#dce78f;--border:#3d3d82;--panel:#101022;--toolbar:#17174a}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#0c0c1c;color:#c9c9e2;font-family:Arial,'Segoe UI',sans-serif}
button,input{font:inherit}
.reader{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(180deg,#1a1a56,#13133f);border-bottom:1px solid #35357b}
.title{margin-right:auto;color:#e2e2ff;font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.search{display:flex;align-items:center;gap:5px;min-width:250px}
.search input{width:190px;min-height:34px;border:1px solid #44448d;border-radius:5px;background:#09091d;color:#ededff;padding:7px 10px;outline:none}
.search input:focus{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(184,199,111,.12)}
.count{min-width:42px;color:#9494bd;font-size:12px;text-align:center;white-space:nowrap}
.langs{display:flex;gap:5px}
.lang,.back,.search-nav,.close{min-height:34px;border:1px solid #44448d;border-radius:5px;background:#0c0c24;color:#aaaadd;font-weight:600;font-size:12px;padding:7px 10px;cursor:pointer}
.back,.close{font-size:18px;line-height:1}
.lang:hover,.lang.active,.back:hover:not(:disabled),.search-nav:hover:not(:disabled),.close:hover{border-color:var(--yellow);color:#eef58f;background:#202044}
.back:disabled,.search-nav:disabled{opacity:.3;cursor:default}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0;background:var(--panel)}
.toc{overflow:auto;padding:22px 15px;border-right:1px solid #292960;background:#0a0a19}
.toc a{display:block;color:#8484ba;font-size:14px;line-height:1.45;padding:7px 10px;border-radius:5px;text-decoration:none}
.toc a:hover{color:#eef58f;background:#171738}
.toc a.h3{padding-left:20px;font-size:13px}
.toc a.search-muted{opacity:.24}
.toc a.search-match{color:#eef58f;background:#202044}
.content{overflow-y:auto;overflow-x:hidden;padding:44px clamp(28px,5vw,72px);scroll-behavior:smooth;color:#c9c9e2;font-size:16px;line-height:1.72}
.content>*{max-width:850px;margin-left:auto;margin-right:auto}
.content h1,.content h2,.content h3,.content h4,.content h5,.content h6{color:#ededff;line-height:1.3;scroll-margin-top:24px}
.content h1{font-size:clamp(26px,3vw,38px);color:var(--yellow);margin-bottom:30px}
.content h2{font-size:22px;margin-top:48px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #343474}
.content h3{font-size:17px;margin-top:32px;margin-bottom:12px}
.content p,.content ul,.content ol,.content pre,.content table,.content blockquote{margin-top:0;margin-bottom:18px}
.content a{color:#aeb9ff;text-decoration:underline;text-underline-offset:3px}
.content code{font-family:Consolas,'Courier New',monospace;background:#090918;color:#dbe98d;padding:.14em .38em;border:1px solid #29295d;border-radius:4px;font-size:.9em}
.content pre{overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#080814;border:1px solid #33336e;border-radius:7px;padding:18px 20px}
.content pre code{padding:0;border:0;background:none;color:#cbe2a1;white-space:inherit}
.content table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
.content th,.content td{border:1px solid #33336e;padding:10px 13px;text-align:left;vertical-align:top}
.content th{background:#19194b;color:#ededff}
.content blockquote{border-left:3px solid var(--yellow);padding:10px 18px;background:rgba(184,199,111,.06)}
.content mark.hit{background:#77782c;color:#fff;border-radius:2px}
.content mark.hit.active{background:#e4e873;color:#090912;box-shadow:0 0 0 2px rgba(228,232,115,.25)}
.error{color:#ef7777}
.toc,.content,.content pre,.content table{scrollbar-color:#4d4d99 #090918;scrollbar-width:thin}
.toc::-webkit-scrollbar,.content::-webkit-scrollbar,.content pre::-webkit-scrollbar,.content table::-webkit-scrollbar{width:10px;height:10px}
.toc::-webkit-scrollbar-track,.content::-webkit-scrollbar-track,.content pre::-webkit-scrollbar-track,.content table::-webkit-scrollbar-track{background:#090918}
.toc::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.content pre::-webkit-scrollbar-thumb,.content table::-webkit-scrollbar-thumb{background:#45458c;border:2px solid #090918;border-radius:8px}
@media(max-width:900px){.toolbar{flex-wrap:wrap;padding:10px 12px}.title{flex:1}.search{order:2;width:100%}.search input{width:auto;flex:1;min-width:0}.langs{order:3;width:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.lang{min-width:0;padding:7px 3px}.layout{grid-template-columns:1fr}.toc{display:none}.content{padding:24px 16px;font-size:15px;-webkit-overflow-scrolling:touch}.content pre{padding:14px 12px}}
</style>
</head>
<body>
<div class="reader">
  <header class="toolbar">
    <button class="back" type="button" title="Back" aria-label="Go back to previous document position" disabled>←</button>
    <div class="title">Visual Assembler Documentation</div>
    <div class="search" role="search">
      <input type="search" placeholder="Search documentation" aria-label="Search documentation" autocomplete="off">
      <span class="count" aria-live="polite">0 / 0</span>
      <button class="search-nav prev" type="button" aria-label="Previous result" disabled>↑</button>
      <button class="search-nav next" type="button" aria-label="Next result" disabled>↓</button>
    </div>
    <div class="langs" aria-label="Documentation language">
      <button class="lang" data-doc="en">EN</button><button class="lang" data-doc="hu">HU</button><button class="lang" data-doc="de">DE</button><button class="lang" data-doc="fr">FR</button><button class="lang" data-doc="nl">NL</button><button class="lang" data-doc="fi">FI</button><button class="lang" data-doc="it">IT</button><button class="lang" data-doc="sv">SV</button>
    </div>
    <button class="close" type="button" title="Close" aria-label="Close documentation">×</button>
  </header>
  <div class="layout">
    <aside class="toc" aria-label="Table of contents"></aside>
    <main class="content"><p>Loading documentation...</p></main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
const content=document.querySelector('.content');
const toc=document.querySelector('.toc');
const searchInput=document.querySelector('.search input');
const searchCount=document.querySelector('.count');
const searchPrev=document.querySelector('.prev');
const searchNext=document.querySelector('.next');
const backButton=document.querySelector('.back');
const languages=['en','hu','de','fr','nl','fi','it','sv'];
const savedLanguage=document.cookie.split('; ').find(row=>row.startsWith('va_docs_lang='))?.split('=')[1];
let currentLanguage=languages.includes(savedLanguage)?savedLanguage:'en';
let searchHits=[];
let searchIndex=-1;
let navigationHistory=[];
let sizeSaveTimer=null;

function saveWindowSize(){
  if(window.outerWidth<320||window.outerHeight<320)return;
  document.cookie='va_docs_width='+Math.round(window.outerWidth)+'; Max-Age=31536000; Path=/; SameSite=Lax';
  document.cookie='va_docs_height='+Math.round(window.outerHeight)+'; Max-Age=31536000; Path=/; SameSite=Lax';
}
window.addEventListener('resize',()=>{
  clearTimeout(sizeSaveTimer);
  sizeSaveTimer=setTimeout(saveWindowSize,250);
});
window.addEventListener('beforeunload',saveWindowSize);

function textKey(text){return text.toLocaleLowerCase().replace(/\s+/g,' ').trim()}
function slug(text,index){return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'section-'+index}
function scrollToHeading(heading,remember=true){
  if(!heading)return;
  if(remember){navigationHistory.push(content.scrollTop);backButton.disabled=false}
  const top=content.scrollTop+heading.getBoundingClientRect().top-content.getBoundingClientRect().top-24;
  content.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function clearSearch(){
  content.querySelectorAll('mark.hit').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)));
  content.normalize();
  toc.querySelectorAll('a').forEach(link=>link.classList.remove('search-muted','search-match'));
  searchHits=[];searchIndex=-1;
}
function showHit(index){
  if(!searchHits.length)return;
  searchHits.forEach(hit=>hit.classList.remove('active'));
  searchIndex=(index+searchHits.length)%searchHits.length;
  searchHits[searchIndex].classList.add('active');
  searchHits[searchIndex].scrollIntoView({behavior:'smooth',block:'center'});
  searchCount.textContent=(searchIndex+1)+' / '+searchHits.length;
}
function updateSearch(){
  clearSearch();
  const query=searchInput.value.trim();
  if(query){
    const needle=query.toLocaleLowerCase();
    toc.querySelectorAll('a').forEach(link=>link.classList.add(link.textContent.toLocaleLowerCase().includes(needle)?'search-match':'search-muted'));
    const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT),nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const text=node.nodeValue,lower=text.toLocaleLowerCase();let start=0,index=lower.indexOf(needle);
      if(index<0)return;
      const fragment=document.createDocumentFragment();
      while(index>=0){fragment.append(text.slice(start,index));const mark=document.createElement('mark');mark.className='hit';mark.textContent=text.slice(index,index+query.length);fragment.append(mark);start=index+query.length;index=lower.indexOf(needle,start)}
      fragment.append(text.slice(start));node.replaceWith(fragment);
    });
    searchHits=[...content.querySelectorAll('mark.hit')];
  }
  const hasHits=searchHits.length>0;searchPrev.disabled=!hasHits;searchNext.disabled=!hasHits;
  searchCount.textContent=hasHits?'1 / '+searchHits.length:'0 / 0';if(hasHits)showHit(0);
}
async function openDocument(language){
  if(!languages.includes(language))language=currentLanguage;
  currentLanguage=language;document.cookie='va_docs_lang='+language+'; Max-Age=31536000; Path=/; SameSite=Lax';
  const url=new URL(location.href);url.searchParams.set('doc',language);history.replaceState(null,'',url);
  document.documentElement.lang=language;document.querySelectorAll('.lang').forEach(button=>button.classList.toggle('active',button.dataset.doc===language));
  navigationHistory=[];backButton.disabled=true;searchInput.value='';content.innerHTML='<p>Loading documentation...</p>';toc.innerHTML='';updateSearch();
  try{
    const response=await fetch(language+'.md');if(!response.ok)throw new Error('HTTP '+response.status);
    const markdown=(await response.text()).replace(/^(\*\*[^*\r\n]*\S)[ \t]+\*\*[ \t]*$/gm,'$1**');
    if(!window.marked||!window.DOMPurify)throw new Error('Markdown renderer unavailable');
    content.innerHTML=DOMPurify.sanitize(marked.parse(markdown,{gfm:true,breaks:false}));
    const allHeadings=[...content.querySelectorAll('h1,h2,h3,h4,h5,h6')],byText=new Map();
    allHeadings.forEach(heading=>{const key=textKey(heading.textContent);if(!byText.has(key))byText.set(key,[]);byText.get(key).push(heading)});
    content.querySelectorAll('a[href^="#"]').forEach(link=>{const heading=byText.get(textKey(link.textContent))?.find(item=>!item.dataset.linkedId);if(heading)heading.dataset.linkedId=decodeURIComponent(link.getAttribute('href').slice(1))});
    const used=new Set();allHeadings.forEach((heading,index)=>{const base=heading.dataset.linkedId||slug(heading.textContent,index);let id=base,suffix=2;while(used.has(id))id=base+'-'+suffix++;used.add(id);heading.id=id});
    allHeadings.filter(heading=>heading.matches('h2,h3')).forEach(heading=>{const link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;if(heading.tagName==='H3')link.className='h3';toc.appendChild(link)});
    content.scrollTop=0;
  }catch(error){content.innerHTML='<p class="error">The documentation could not be loaded. Please try again.</p>';console.error(error)}
}
function handleAnchor(event){const link=event.target.closest('a[href^="#"]');if(!link)return;const id=decodeURIComponent(link.getAttribute('href').slice(1));const heading=[...content.querySelectorAll('h1,h2,h3,h4,h5,h6')].find(item=>item.id===id);if(!heading)return;event.preventDefault();scrollToHeading(heading)}
content.addEventListener('click',handleAnchor);toc.addEventListener('click',handleAnchor);
document.querySelectorAll('.lang').forEach(button=>button.addEventListener('click',()=>openDocument(button.dataset.doc)));
searchInput.addEventListener('input',updateSearch);searchInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&searchHits.length){event.preventDefault();showHit(searchIndex+(event.shiftKey?-1:1))}});
searchPrev.addEventListener('click',()=>showHit(searchIndex-1));searchNext.addEventListener('click',()=>showHit(searchIndex+1));
backButton.addEventListener('click',()=>{if(!navigationHistory.length)return;content.scrollTo({top:navigationHistory.pop(),behavior:'smooth'});backButton.disabled=navigationHistory.length===0});
document.querySelector('.close').addEventListener('click',()=>window.close());
document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
const requested=new URLSearchParams(location.search).get('doc');openDocument(languages.includes(requested)?requested:currentLanguage);
</script>
</body>
</html>
