[package]
name = "c64-visual-assembler"
version = "2.8.1"
edition = "2021"

[lib]
name = "c64_visual_assembler_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
resid-rs = { path = "vendor/resid-rs" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
base64 = "0.22"
emulator_6502 = { version = "1.1.0", features = ["implementation_transparency"] }
urlencoding = "2"
serialport = { version = "4.7", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd"] }
ultimate-basic = { git = "https://github.com/zstarczali/UltimateBasic.git", rev = "6392b79b41bd3231cd4ec2a54708570b0111cadc" }
# the VMA compiler: its own repository; for local work on it, a [patch] with path = "../../VMA"
vma = { git = "https://github.com/zstarczali/VMA.git", rev = "7a7d7fff6b86d065ad5174ba7b771a75e0cc8f4a" }
# the R65 KickAssembler compatible assembler (library, without its editor window); local work: [patch] path = "../../R65"
r65 = { git = "https://github.com/zstarczali/R65.git", rev = "e28a167f74d18bc0472ddb8d129533eab3c2f607", default-features = false }

# `tauri dev` speed: the SID emulation (VA SID Core, 6502 CPU) runs slower than
# real time unoptimised. Dependencies build once at opt-level 2, the app at 1.
# the version wry uses: it moves together with Tauri
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
