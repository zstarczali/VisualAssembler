<svg width="1600" height="1200" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0420"/><stop offset=".55" stop-color="#2b0b4f"/><stop offset="1" stop-color="#5a1466"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14a"/><stop offset=".5" stop-color="#ff8a2a"/><stop offset="1" stop-color="#ff2f87"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#9fd8ff"/><stop offset=".5" stop-color="#1b3a7a"/>
      <stop offset=".52" stop-color="#3a2a5a"/><stop offset=".7" stop-color="#ffb3e1"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/><stop offset=".5" stop-color="#f6c51e"/><stop offset=".52" stop-color="#b8740a"/><stop offset="1" stop-color="#ffe46a"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="400" height="190"/></clipPath>
    <clipPath id="disc"><circle cx="200" cy="190" r="128"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8"><circle cx="40" cy="30" r="1"/><circle cx="90" cy="60" r="1.2"/><circle cx="330" cy="25" r="1"/><circle cx="365" cy="80" r="1.3"/><circle cx="260" cy="45" r=".9"/><circle cx="20" cy="110" r="1"/><circle cx="150" cy="18" r="1"/></g>
  <g clip-path="url(#sunclip)">
    <circle cx="200" cy="190" r="128" fill="url(#sun)"/>
    <g fill="#2b0b4f" clip-path="url(#disc)"><rect x="60" y="128" width="280" height="3"/><rect x="60" y="141" width="280" height="5"/><rect x="60" y="155" width="280" height="7"/><rect x="60" y="169" width="280" height="9"/><rect x="60" y="182" width="280" height="8"/></g>
  </g>
  <rect y="190" width="400" height="110" fill="#14062c"/>
  <g stroke="#ff3fb4" stroke-width="1.4" filter="url(#glow)" fill="none">
    <line x1="0" y1="190" x2="400" y2="190" stroke-width="2"/>
    <line x1="0" y1="198" x2="400" y2="198"/><line x1="0" y1="210" x2="400" y2="210"/><line x1="0" y1="227" x2="400" y2="227"/>
    <line x1="0" y1="251" x2="400" y2="251"/><line x1="0" y1="284" x2="400" y2="284"/>
    <line x1="200" y1="190" x2="200" y2="300"/><line x1="180" y1="190" x2="120" y2="300"/><line x1="220" y1="190" x2="280" y2="300"/>
    <line x1="160" y1="190" x2="40" y2="300"/><line x1="240" y1="190" x2="360" y2="300"/>
    <line x1="140" y1="190" x2="-40" y2="300"/><line x1="260" y1="190" x2="440" y2="300"/>
    <line x1="120" y1="190" x2="-120" y2="300"/><line x1="280" y1="190" x2="520" y2="300"/>
  </g>
  <!-- pixel prompt from the VA logo -->
  <g fill="#f6d321" filter="url(#glow)" transform="translate(178 16)">
    <rect x="0" y="0" width="7" height="7"/><rect x="7" y="7" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
    <rect x="7" y="21" width="7" height="7"/><rect x="0" y="28" width="7" height="7"/><rect x="28" y="28" width="7" height="7"/>
  </g>
  <g font-family="Impact, 'Arial Black', sans-serif" font-style="italic" text-anchor="middle" transform="skewX(-10) translate(28 0)">
    <text x="200" y="128" font-size="72" fill="#1a0838" stroke="#1a0838" stroke-width="10" stroke-linejoin="round" letter-spacing="2">VISUAL</text>
    <text x="200" y="128" font-size="72" fill="url(#chrome)" stroke="#fff" stroke-width="1.2" letter-spacing="2">VISUAL</text>
    <text x="200" y="178" font-size="50" fill="#1a0838" stroke="#1a0838" stroke-width="9" stroke-linejoin="round" letter-spacing="3">ASSEMBLER</text>
    <text x="200" y="178" font-size="50" fill="url(#gold)" stroke="#fff6c8" stroke-width="1" letter-spacing="3">ASSEMBLER</text>
  </g>
  <text x="205" y="222" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="40" fill="#5ef2ff" stroke="#0b0420" stroke-width="4" paint-order="stroke" filter="url(#glow)" transform="rotate(-6 205 222)">Commodore 64</text>
  <g fill="#fff"><path d="M300 92 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z" opacity=".95"/><path d="M92 160 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z" opacity=".85"/></g>
</svg>
