<!doctype html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <title>C64 Visual Assembler — Browser Run</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #err { display: none; position: fixed; inset: 0; color: #f55; padding: 2rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="canvas" style="border: 0px none;"></canvas>
  <div id="err"></div>
  <script>
    (function () {
      var hash = window.location.hash.slice(1);
      if (!hash) {
        var el = document.getElementById('err');
        el.style.display = 'block';
        el.textContent = 'No program data.';
        return;
      }
      try {
        var data = atob(hash);
        var bytes = new Uint8Array(data.length);
        for (var i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i);
        function loadFiles() {
          FS.createDataFile('/', 'program.prg', bytes, true, true);
        }
        window.Module = {
          preRun: [loadFiles],
          arguments: ['-autostart', 'program.prg', '+sound'],
          canvas: document.getElementById('canvas'),
        };
      } catch (e) {
        var el2 = document.getElementById('err');
        el2.style.display = 'block';
        el2.textContent = 'Failed to start emulator:\n' + e.message;
      }
    })();
  </script>
  <script src="x64.js"></script>
</body>
</html>
