<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About C64 Visual Assembler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0d0d1a;
      color: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 28px 36px;
      text-align: center;
    }

    .logo svg {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(27,58,143,0.5);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #e8f0ff;
      margin-top: 4px;
    }

    .version {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #7090d0;
    }

    .desc {
      font-size: 13px;
      color: #a0b0d0;
      line-height: 1.6;
      max-width: 280px;
    }

    .author {
      font-size: 12px;
      color: #607090;
    }

    .links {
      display: flex;
      gap: 16px;
    }

    .links a {
      font-size: 12px;
      color: #4a7fd4;
      text-decoration: none;
      cursor: pointer;
    }
    .links a:hover { text-decoration: underline; }

    button {
      margin-top: 6px;
      padding: 8px 32px;
      background: #1b3a8f;
      color: #e8f0ff;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2a52c0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#1b3a8f"/>
        <text x="7" y="34" font-family="IBM Plex Mono,monospace" font-size="22" font-weight="700" fill="#e8f0ff">C64</text>
      </svg>
    </div>
    <h1>C64 Visual Assembler</h1>
    <p class="version" id="version">v1.3.7</p>
    <p class="desc">A visual block-based 6502 assembler for the Commodore 64.<br>Build programs by dragging and dropping instruction blocks.</p>
    <p class="author">&#169; 2026 Zsolt Tarczali</p>
    <div class="links">
      <a id="link-github">GitHub</a>
      <a id="link-manual">Manual</a>
    </div>
    <button id="btn-close">Close</button>
  </div>

  <script>
    const invoke = window.__TAURI__?.core?.invoke;

    document.getElementById("btn-close").addEventListener("click", () => {
      invoke?.("close_about_window");
    });

    document.getElementById("link-github").addEventListener("click", () => {
      invoke?.("open_external", { url: "https://github.com/zstarczali/VisualAssembler" });
    });

    document.getElementById("link-manual").addEventListener("click", () => {
      invoke?.("open_external", { url: "https://github.com/zstarczali/VisualAssembler/blob/main/MANUAL.md" });
    });

    if (invoke) {
      invoke("get_app_version").then(v => {
        document.getElementById("version").textContent = "v" + v;
      }).catch(() => {});
    }
  </script>
</body>
</html>
