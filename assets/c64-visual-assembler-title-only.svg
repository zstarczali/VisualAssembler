<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Visual Assembler for Commodore 64</title>
  <desc id="desc">Centered title with accurate Commodore C= logo</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a59"/>
      <stop offset="55%" stop-color="#2d2a86"/>
      <stop offset="100%" stop-color="#4742ab"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#85ffc6"/>
      <stop offset="50%" stop-color="#74e7ff"/>
      <stop offset="100%" stop-color="#d1ddff"/>
    </linearGradient>

    <filter id="titleGlow" x="-40%" y="-50%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="22" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="lb"/>
      <feMerge>
        <feMergeNode in="lb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#titleGlow)" text-anchor="middle">
    <text x="800" y="350" fill="url(#titleGrad)" font-family="'Space Grotesk', Segoe UI, sans-serif" font-size="122" font-weight="700">VISUAL ASSEMBLER</text>
    <text x="800" y="420" fill="#d9e0ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="48">FOR COMMODORE 64</text>
  </g>

  <g transform="translate(800,590) scale(2.6) translate(-65,-61)" filter="url(#logoGlow)">
    <path d="m 77.999911,88.1109 v 31.4724 a 61,61 0 1 1 0,-117.1666 v 31.4724 a 32,32 0 1 0 0,54.2218" fill="#002255"/>
    <polygon transform="translate(-5.0000894,-9)" points="111,67 135,43 83,43 83,67" fill="#002255"/>
    <polygon transform="translate(-5.0000894,-9)" points="111,73 135,97 83,97 83,73" fill="#ff0000"/>
  </g>
</svg>



