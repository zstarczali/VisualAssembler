<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Visual Assembler C64 cover v2</title>
  <desc id="desc">Centered title, stronger glow, retro C64 atmosphere</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16134d"/>
      <stop offset="45%" stop-color="#2d2786"/>
      <stop offset="100%" stop-color="#4a44b1"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#6ed9ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6ed9ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78ffbe"/>
      <stop offset="50%" stop-color="#6ce4ff"/>
      <stop offset="100%" stop-color="#b5c6ff"/>
    </linearGradient>

    <filter id="titleGlow" x="-35%" y="-40%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="11" result="b1"/>
      <feGaussianBlur stdDeviation="24" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g opacity="0.24">
    <rect x="84" y="170" width="420" height="540" rx="20" fill="#b9c0ff"/>
    <rect x="530" y="170" width="510" height="540" rx="20" fill="#b9c0ff"/>
    <rect x="1068" y="170" width="448" height="540" rx="20" fill="#b9c0ff"/>
  </g>

  <g transform="translate(112,220)">
    <rect width="366" height="86" rx="16" fill="#8ad9ff"/>
    <text x="22" y="54" fill="#102a67" font-family="'IBM Plex Mono', Consolas, monospace" font-size="44" font-weight="700">LDA #$00</text>
  </g>
  <g transform="translate(112,324)">
    <rect width="366" height="86" rx="16" fill="#98f0bf"/>
    <text x="22" y="54" fill="#134d42" font-family="'IBM Plex Mono', Consolas, monospace" font-size="44" font-weight="700">STA $D020</text>
  </g>
  <g transform="translate(112,428)">
    <rect width="366" height="86" rx="16" fill="#ffd58b"/>
    <text x="22" y="54" fill="#744a06" font-family="'IBM Plex Mono', Consolas, monospace" font-size="44" font-weight="700">JMP loop</text>
  </g>

  <g transform="translate(556,220)">
    <rect width="458" height="398" rx="18" fill="#171451" stroke="#8da0ff" stroke-opacity="0.5"/>
    <text x="24" y="56" fill="#99e2ff" font-family="'Space Grotesk', Segoe UI, sans-serif" font-size="32" font-weight="700">Assembler View</text>
    <text x="24" y="110" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">loop:</text>
    <text x="24" y="154" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">LDA $D020</text>
    <text x="24" y="198" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">CLC</text>
    <text x="24" y="242" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">ADC #$01</text>
    <text x="24" y="286" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">STA $D020</text>
    <text x="24" y="330" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31">JMP loop</text>
  </g>

  <g transform="translate(1094,220)">
    <rect width="396" height="398" rx="18" fill="#171451" stroke="#8da0ff" stroke-opacity="0.5"/>
    <text x="22" y="56" fill="#99e2ff" font-family="'Space Grotesk', Segoe UI, sans-serif" font-size="32" font-weight="700">Monitor View</text>
    <text x="22" y="106" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="28">$0801  78</text>
    <text x="22" y="146" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="28">$0802  A9 00</text>
    <text x="22" y="186" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="28">$0804  8D 20 D0</text>
    <text x="22" y="226" fill="#e4e8ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="28">$0807  4C 02 08</text>
    <rect x="22" y="266" width="348" height="18" rx="9" fill="#302f79"/>
    <rect x="22" y="266" width="146" height="18" rx="9" fill="#f78696"/>
  </g>

  <g filter="url(#titleGlow)" text-anchor="middle">
    <text x="800" y="108" fill="url(#titleGrad)" font-family="'Space Grotesk', Segoe UI, sans-serif" font-size="106" font-weight="700">VISUAL ASSEMBLER</text>
    <text x="800" y="154" fill="#d4ddff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="38">COMMODORE 64 EDITION</text>
  </g>

  <g transform="translate(588,736)">
    <rect width="424" height="76" rx="16" fill="#231e63" stroke="#8da0ff" stroke-opacity="0.52"/>
    <text x="212" y="50" text-anchor="middle" fill="#dbe2ff" font-family="'IBM Plex Mono', Consolas, monospace" font-size="38">*= $0801</text>
  </g>
</svg>
